version: '3.8'

services:
  bitcoin_bot:
    build: .
    container_name: btc_trading_bot
    image: btc_trading_bot:latest

    # Sunucu restart olsa bile, container crash etse bile otomatik yeniden başlar
    restart: always

    # .env dosyasındaki tüm API anahtarlarını otomatik yükle
    env_file:
      - .env

    environment:
      - PYTHONUTF8=1
      - TZ=Europe/Istanbul
      - TRADING_MODE=live

    volumes:
      # Loglar ve state dışarıda kalır — container silinse bile kaybolmaz
      - ./data:/app/data
      - ./logs:/app/logs

    # Bellek limiti: Trading bot için 512MB fazlasıyla yeterli
    mem_limit: 512m

    # Ağ kesintisinde container'ı öldürme, bot kendi retry mekanizmasıyla halleder
    stop_grace_period: 30s

    # Log rotasyonu: Disk dolmasın
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
